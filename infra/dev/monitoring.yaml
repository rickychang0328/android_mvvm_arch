AWSTemplateFormatVersion: '2010-09-09'
Description: Monitoring stack for notification backend in dev.

Parameters:
  ProjectName:
    Type: String
    Default: android-mvvm-arch
  Environment:
    Type: String
    Default: dev
  ApiFunctionName:
    Type: String
  WorkerFunctionName:
    Type: String
  MainQueueName:
    Type: String
  DeadLetterQueueName:
    Type: String
  DbInstanceIdentifier:
    Type: String
  AlarmSnsTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmSnsTopicArn, '']]

Resources:
  ApiLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-api-errors'
      AlarmDescription: API Lambda errors > 0 in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

  WorkerLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-worker-errors'
      AlarmDescription: Worker Lambda errors > 0 in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

  WorkerLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-worker-throttles'
      AlarmDescription: Worker Lambda throttles > 0 in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

  MainQueueOldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-mainqueue-oldest'
      AlarmDescription: Oldest message age on main queue > 300 seconds.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Ref MainQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

  DeadLetterQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-dlq-depth'
      AlarmDescription: Dead letter queue has visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref DeadLetterQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-db-cpu-high'
      AlarmDescription: RDS CPU utilization > 80%.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmSnsTopicArn], !Ref AWS::NoValue]

Outputs:
  ApiLambdaErrorsAlarmName:
    Description: Name of API errors alarm.
    Value: !Ref ApiLambdaErrorsAlarm
  WorkerLambdaErrorsAlarmName:
    Description: Name of worker errors alarm.
    Value: !Ref WorkerLambdaErrorsAlarm
  DeadLetterQueueDepthAlarmName:
    Description: Name of DLQ depth alarm.
    Value: !Ref DeadLetterQueueDepthAlarm
