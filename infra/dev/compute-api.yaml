AWSTemplateFormatVersion: '2010-09-09'
Description: API compute stack for notification backend in dev.

Parameters:
  ProjectName:
    Type: String
    Default: android-mvvm-arch
  Environment:
    Type: String
    Default: dev
  LambdaRuntime:
    Type: String
    Default: nodejs20.x
  LambdaHandler:
    Type: String
    Default: index.handler
  LambdaMemorySize:
    Type: Number
    Default: 512
  LambdaTimeout:
    Type: Number
    Default: 30
  ApiLogRetentionDays:
    Type: Number
    Default: 14
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  JwtIssuer:
    Type: String
  JwtAudience:
    Type: String
  NotificationServiceScope:
    Type: String
    Default: notifications:send
  DbSecretArn:
    Type: String
  DbEndpointAddress:
    Type: String
  DbEndpointPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
  MainQueueUrl:
    Type: String
  MainQueueArn:
    Type: String
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PrivateSubnetIds:
    Type: CommaDelimitedList

Resources:
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-api-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-api-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !Ref MainQueueArn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-api-handler'
      RetentionInDays: !Ref ApiLogRetentionDays

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api-handler'
      Runtime: !Ref LambdaRuntime
      Handler: !Ref LambdaHandler
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt ApiFunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          JWT_ISSUER: !Ref JwtIssuer
          JWT_AUDIENCE: !Ref JwtAudience
          NOTIFICATION_SERVICE_SCOPE: !Ref NotificationServiceScope
          DB_SECRET_ARN: !Ref DbSecretArn
          DB_ENDPOINT: !Ref DbEndpointAddress
          DB_PORT: !Ref DbEndpointPort
          DB_NAME: !Ref DbName
          SQS_NOTIFICATION_QUEUE_URL: !Ref MainQueueUrl

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-notification-http-api'
      ProtocolType: HTTP

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  RegisterTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/push/register-token
      Target: !Sub 'integrations/${ApiIntegration}'

  InternalSendRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/internal/notifications/send
      Target: !Sub 'integrations/${ApiIntegration}'

  MarkOpenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/notifications/{id}/open
      Target: !Sub 'integrations/${ApiIntegration}'

  GetNotificationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/notifications
      Target: !Sub 'integrations/${ApiIntegration}'

  MarkReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PATCH /api/v1/notifications/{id}/read
      Target: !Sub 'integrations/${ApiIntegration}'

  MarkAllReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/notifications/read-all
      Target: !Sub 'integrations/${ApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint.
    Value: !GetAtt HttpApi.ApiEndpoint
  HttpApiId:
    Description: API Gateway HTTP API id.
    Value: !Ref HttpApi
  ApiFunctionName:
    Description: Lambda function name for API handler.
    Value: !Ref ApiFunction
  ApiFunctionArn:
    Description: Lambda function ARN for API handler.
    Value: !GetAtt ApiFunction.Arn
