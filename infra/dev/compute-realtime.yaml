AWSTemplateFormatVersion: '2010-09-09'
Description: Realtime compute stack (WebSocket API + connection manager Lambda + DynamoDB connections table) for notification backend in dev.

Parameters:
  ProjectName:
    Type: String
    Default: android-mvvm-arch
  Environment:
    Type: String
    Default: dev
  LambdaRuntime:
    Type: String
    Default: nodejs20.x
  LambdaHandler:
    Type: String
    Default: index.handler
  RealtimeMemorySize:
    Type: Number
    Default: 256
  RealtimeTimeout:
    Type: Number
    Default: 15
  RealtimeLogRetentionDays:
    Type: Number
    Default: 14
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  JwtIssuer:
    Type: String
  JwtAudience:
    Type: String
  WebSocketStageName:
    Type: String
    Default: dev

Resources:
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-ws-connections'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-ws-connections'

  RealtimeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-realtime-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-realtime-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub '${ConnectionsTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  RealtimeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-realtime-handler'
      RetentionInDays: !Ref RealtimeLogRetentionDays

  RealtimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-realtime-handler'
      Runtime: !Ref LambdaRuntime
      Handler: !Ref LambdaHandler
      MemorySize: !Ref RealtimeMemorySize
      Timeout: !Ref RealtimeTimeout
      Role: !GetAtt RealtimeFunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          JWT_ISSUER: !Ref JwtIssuer
          JWT_AUDIENCE: !Ref JwtAudience
          CONNECTIONS_TABLE_NAME: !Ref ConnectionsTable

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-notification-ws-api'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RealtimeFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref WebSocketStageName
      AutoDeploy: true

  RealtimeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'

Outputs:
  WebSocketApiId:
    Description: WebSocket API id.
    Value: !Ref WebSocketApi
  WebSocketApiEndpoint:
    Description: Client-facing WebSocket endpoint (wss).
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStageName}'
  WebSocketManagementEndpoint:
    Description: Management endpoint for postToConnection (https).
    Value: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStageName}'
  ConnectionsTableName:
    Description: DynamoDB connections table name.
    Value: !Ref ConnectionsTable
  ConnectionsTableArn:
    Description: DynamoDB connections table ARN.
    Value: !GetAtt ConnectionsTable.Arn
  RealtimeFunctionName:
    Description: Realtime Lambda function name.
    Value: !Ref RealtimeFunction
  RealtimeFunctionArn:
    Description: Realtime Lambda function ARN.
    Value: !GetAtt RealtimeFunction.Arn
